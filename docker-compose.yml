# Local development stack. `make up` is the only command a new developer needs.
name: careslot

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careslot
      POSTGRES_PASSWORD: careslot  # local-only throwaway credential
      POSTGRES_DB: careslot
    # 5433 on the host so it never collides with a locally installed PostgreSQL.
    ports: ["${CARESLOT_DB_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careslot"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false  # defaults work without it; copy .env.example to override
    environment:
      CARESLOT_DATABASE_URL: postgresql+psycopg://careslot:careslot@db:5432/careslot
    depends_on:
      db: { condition: service_healthy }
    # Migrations run before the server starts so the schema is always current locally.
    command: sh -c "alembic upgrade head && uvicorn careslot.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:8080"]
    depends_on: [api]

volumes:
  pgdata:
