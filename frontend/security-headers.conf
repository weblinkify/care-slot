# Included in EVERY location block. nginx gotcha: a location that sets any add_header of its
# own (e.g. Cache-Control) stops inheriting add_header from the server block - which silently
# dropped all of these headers until the container check in docs caught it.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000; img-src 'self' data:; style-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
