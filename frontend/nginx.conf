server {
  listen 8080;
  root /usr/share/nginx/html;

  # Security headers - mirror the API's headers and vercel.json so every environment matches.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback: client-side routes resolve to index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
