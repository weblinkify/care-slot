# Quality gates. They apply identically to human- and AI-authored changes: there is no
# "AI lane" and no way to merge red. Every job calls the same Makefile targets developers run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: cd backend && uv sync --frozen
      - name: Lint (ruff + import boundaries)
        run: cd backend && uv run ruff check . && uv run ruff format --check . && uv run lint-imports
      - name: Type check (mypy strict)
        run: cd backend && uv run mypy
      - name: Unit + integration tests (Testcontainers PostgreSQL)
        run: cd backend && uv run pytest --cov --cov-report=term-missing
      - name: OpenAPI contract is committed and current
        # API-first: the spec is reviewed in PRs. Code that changes the API without updating
        # api/openapi.json fails here.
        run: |
          cd backend && uv run python -m careslot.openapi > ../api/openapi.json
          git diff --exit-code -- ../api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Lint (eslint + prettier incl. tailwind class order)
        run: cd frontend && npm run lint
      - name: Type check (tsc strict)
        run: cd frontend && npm run typecheck
      - name: Unit tests (vitest)
        run: cd frontend && npm test
      - name: Generated API types match the contract
        run: cd frontend && npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - name: Build
        run: cd frontend && npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack (db, api, web) and seed synthetic data
        run: |
          make env
          docker compose up --build -d --wait db api
          docker compose up --build -d web
          docker compose exec -T api python -m careslot.seed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Playwright (booking journey + axe WCAG 2.2 AA)
        run: cd frontend && npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - if: failure()
        run: docker compose logs api

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, full history)
        # Container instead of gitleaks-action: the action needs a paid licence for orgs.
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 detect --source=/repo --config=/repo/.gitleaks.toml --redact -v
      - uses: astral-sh/setup-uv@v6
      - name: Python dependency audit (pip-audit)
        run: cd backend && uv export --frozen --no-hashes --no-emit-project > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm dependency audit
        run: cd frontend && npm audit --audit-level=high

  containers:
    # Build the images we would deploy, record what is inside them (SBOM) and refuse to ship
    # known, fixable HIGH/CRITICAL vulnerabilities. Tools run from pinned images so local
    # runs (see docs/engineering-standards.md) give the same answer as CI.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          dir=$([ "${{ matrix.image }}" = api ] && echo backend || echo frontend)
          docker build -t careslot-${{ matrix.image }}:${{ github.sha }} "$dir"
      - name: SBOM (SPDX, Syft)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.18.1 \
            careslot-${{ matrix.image }}:${{ github.sha }} -o spdx-json > sbom-${{ matrix.image }}.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
      - name: Vulnerability scan (Trivy) - fail on fixable HIGH/CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            careslot-${{ matrix.image }}:${{ github.sha }}
