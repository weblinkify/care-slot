# Weekly, grouped dependency updates. Each update PR goes through the same CI gates
# (tests, contract tests, pip-audit/npm audit, container scan) as any other change.
# `ignore` entries encode deliberate pins - each has a reason; revisit when it no longer holds.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 2 # keep bot noise (and notification e-mails) down
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet (peer range ^9).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # openapi-typescript declares a TypeScript ^5 peer.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions: { patterns: ["*"] } # one PR for all action bumps

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    ignore:
      # The runtime Python is pinned by requires-python (3.12); upgrade deliberately.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Node is a build-only stage; follow the active LTS line deliberately.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
